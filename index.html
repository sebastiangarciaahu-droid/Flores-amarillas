
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para ti 💛</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  
<audio id="bgMusic" src="Diego Luna - Te Amo Y Más (Letra).mp3" autoplay loop preload="auto"></audio>

  <main class="page">
    <section class="card">
      <div class="eyebrow">✦ UN DETALLE PARA TI PRINCESA STEPHANY ✦</div>

      <h1>Un poquito de sol,<br>
        <span>para ti 💛</span>
      </h1>

      <p class="intro">
        Aunque nos separen la distancia,
        quiero hacerte sonreír ♡
      </p>

      <div
        class="garden"
        id="garden"
        role="img"
        aria-label="Un jardín de girasoles amarillos animados"
      >
        <div class="ground"></div>
      </div>

      <button id="bloomBtn" type="button">
        <span aria-hidden="true">✦</span>
        <span class="button-label">Haz florecer tu ramo</span>
      </button>
      
      <button id="musicBtn" class="music-btn" type="button"
              aria-label="Reproducir música" aria-pressed="false">
        <span aria-hidden="true">♫</span>
        <span id="musicLabel">Reproducir música</span>
      </button>

      <p class="message" id="message" aria-live="polite">
        Si pudiera, te llevaría estas flores en persona.
        Por ahora, te mando un pedacito de sol.
        Te quiero. 💛
      </p>
    </section>

    <footer>Hecho con amor, para ti pollito, aunque sea con código ♡</footer>
  </main>
</body>
</html>
